name: Update Leaderboard

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          
      - name: Fetch leaderboard data
        env:
          LEADERBOARD_API_TOKEN: ${{ secrets.LEADERBOARD_API_TOKEN }}
          LEADERBOARD_API_URL: ${{ secrets.LEADERBOARD_API_URL }}
        run: |
          curl -sf \
            -H "Authorization: Bearer $LEADERBOARD_API_TOKEN" \
            "$LEADERBOARD_API_URL/api/leaderboard" \
            -o leaderboard.json
          
          echo "Leaderboard data fetched successfully:"
          cat leaderboard.json | head -50
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add leaderboard.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to leaderboard data"
          else
            git commit -m "Update leaderboard data [skip ci]"
            git push
          fi
