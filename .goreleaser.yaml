# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

project_name: tkeybr

before:
  hooks:
    - go mod tidy

builds:
  - id: tkeybr
    main: ./cmd/tkeybr
    binary: tkeybr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X github.com/farseenmanekhan1232/tkeybr/internal/config.EmbeddedGoogleClientID={{ .Env.GOOGLE_CLIENT_ID }}
      - -X github.com/farseenmanekhan1232/tkeybr/internal/config.EmbeddedFirebaseCredentials={{ .Env.FIREBASE_CREDENTIALS_BASE64 }}
      - -X github.com/farseenmanekhan1232/tkeybr/internal/config.EmbeddedFirebaseProjectID={{ .Env.FIREBASE_PROJECT_ID }}

  - id: tkeybr-server
    main: ./cmd/server
    binary: tkeybr-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: tkeybr-archive
    builds:
      - tkeybr
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

  - id: tkeybr-server-archive
    builds:
      - tkeybr-server
    format: tar.gz
    name_template: "{{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: tkeybr
    ids:
      - tkeybr-archive
    repository:
      owner: farseenmanekhan1232
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/farseenmanekhan1232/tkeybr"
    description: "Terminal-based keyboard practice app with adaptive learning"
    license: "MIT"
    install: |
      bin.install "tkeybr"
    test: |
      system "#{bin}/tkeybr", "--version"

nfpms:
  - id: packages
    builds:
      - tkeybr
    package_name: tkeybr
    vendor: Hyperkey
    homepage: https://github.com/farseenmanekhan1232/tkeybr
    maintainer: Farseen <farseen@example.com>
    description: Terminal-based keyboard practice app with adaptive learning
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

release:
  github:
    owner: farseenmanekhan1232
    name: tkeybr
  draft: false
  prerelease: auto
